<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#200515" />
      <stop offset="50%" stop-color="#3D0A28" />
      <stop offset="100%" stop-color="#14030D" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <pattern id="gridPink" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EC4899" stroke-width="0.8" stroke-opacity="0.12" />
    </pattern>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradPink)" />
  <rect width="800" height="500" fill="url(#gridPink)" />

  <circle cx="680" cy="110" r="150" fill="#EC4899" fill-opacity="0.12" filter="url(#glowPink)" />
  <circle cx="120" cy="380" r="130" fill="#F472B6" fill-opacity="0.08" filter="url(#glowPink)" />

  <!-- POS Terminal & Retail Counter Graphic -->
  <g transform="translate(400, 180)">
    <!-- Base POS Stand -->
    <path d="M -60 70 L 60 70 L 40 40 L -40 40 Z" fill="#240718" stroke="#F472B6" stroke-width="1.5" />
    <rect x="-16" y="10" width="32" height="40" rx="4" fill="#3D0A28" stroke="#F472B6" stroke-width="1" />
    
    <!-- POS Touch Screen Monitor (Angled) -->
    <rect x="-120" y="-100" width="240" height="150" rx="14" fill="#14030D" stroke="#EC4899" stroke-width="2.5" />
    <rect x="-110" y="-90" width="220" height="130" rx="8" fill="#2B071E" />
    
    <!-- POS Screen UI Content -->
    <!-- Top Bar -->
    <rect x="-102" y="-82" width="204" height="22" rx="4" fill="url(#pinkGrad)" />
    <text x="-92" y="-67" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#000000">iPOS CLOUD</text>
    <text x="92" y="-67" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#000000" text-anchor="end">ORDER #1042</text>

    <!-- Item List on Screen -->
    <rect x="-102" y="-54" width="120" height="16" rx="3" fill="#4A0D32" />
    <rect x="-102" y="-34" width="120" height="16" rx="3" fill="#4A0D32" />
    <rect x="-102" y="-14" width="120" height="16" rx="3" fill="#4A0D32" />
    <text x="-96" y="-42" font-family="'Inter', sans-serif" font-size="8" fill="#FBCFE8">Americano (Iced)</text>
    <text x="-96" y="-22" font-family="'Inter', sans-serif" font-size="8" fill="#FBCFE8">Croissant Butter</text>
    <text x="-96" y="-2" font-family="'Inter', sans-serif" font-size="8" fill="#FBCFE8">Matcha Latte</text>

    <!-- Total & Pay Button on Screen -->
    <rect x="28" y="-54" width="74" height="40" rx="6" fill="#1A0413" stroke="#F472B6" stroke-width="1" />
    <text x="65" y="-42" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FBCFE8" text-anchor="middle">TOTAL</text>
    <text x="65" y="-24" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#00FF88" text-anchor="middle">฿ 285</text>
    <rect x="28" y="-8" width="74" height="22" rx="4" fill="#10B981" />
    <text x="65" y="6" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CHARGE</text>

    <!-- Floating Barcode & Scanner Beam -->
    <g transform="translate(130, -30)">
      <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#240718" stroke="#F472B6" stroke-width="1.5" filter="url(#glowPink)" />
      <!-- Barcode lines -->
      <line x1="-25" y1="-10" x2="-25" y2="10" stroke="#FFFFFF" stroke-width="2" />
      <line x1="-18" y1="-10" x2="-18" y2="10" stroke="#FFFFFF" stroke-width="3" />
      <line x1="-10" y1="-10" x2="-10" y2="10" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="-2" y1="-10" x2="-2" y2="10" stroke="#FFFFFF" stroke-width="2" />
      <line x1="6" y1="-10" x2="6" y2="10" stroke="#FFFFFF" stroke-width="4" />
      <line x1="16" y1="-10" x2="16" y2="10" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="24" y1="-10" x2="24" y2="10" stroke="#FFFFFF" stroke-width="2" />
      <!-- Red laser scan line -->
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#EF4444" stroke-width="2" filter="url(#glowPink)" />
    </g>

    <!-- Floating Receipt -->
    <g transform="translate(-130, 20)">
      <path d="M -25 -30 L 25 -30 L 25 30 L 15 25 L 5 30 L -5 25 L -15 30 L -25 25 Z" fill="#FDF2F8" stroke="#EC4899" stroke-width="1" />
      <line x1="-18" y1="-20" x2="18" y2="-20" stroke="#6B7280" stroke-width="2" />
      <line x1="-18" y1="-12" x2="10" y2="-12" stroke="#9CA3AF" stroke-width="1.5" />
      <line x1="-18" y1="-4" x2="15" y2="-4" stroke="#9CA3AF" stroke-width="1.5" />
      <line x1="-18" y1="6" x2="18" y2="6" stroke="#111827" stroke-width="2" />
    </g>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(400, 400)" text-anchor="middle">
    <rect x="-130" y="-30" width="260" height="24" rx="12" fill="#EC4899" fill-opacity="0.2" stroke="#F472B6" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="-14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#F472B6" letter-spacing="2">E-COMMERCE // IGENCO</text>
    
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">iPOS</text>
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FBCFE8" fill-opacity="0.85">ระบบบริหารจุดขายและการจัดการร้านค้าอัจฉริยะ</text>
  </g>
</svg>