<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34170C" />
      <stop offset="50%" stop-color="#552615" />
      <stop offset="100%" stop-color="#251008" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <pattern id="gridAmber" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EA580C" stroke-width="0.8" stroke-opacity="0.12" />
    </pattern>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradAmber)" />
  <rect width="800" height="500" fill="url(#gridAmber)" />

  <circle cx="680" cy="110" r="150" fill="#EA580C" fill-opacity="0.12" filter="url(#glowAmber)" />
  <circle cx="120" cy="380" r="130" fill="#C2410C" fill-opacity="0.08" filter="url(#glowAmber)" />

  <!-- Mobile Wedding Planner -->
  <g transform="translate(400, 185)">
    <!-- Smartphone Outline -->
    <rect x="-85" y="-130" width="170" height="250" rx="24" fill="#1C0D07" stroke="#EA580C" stroke-width="2.5" />
    <!-- Dynamic Island / Speaker -->
    <rect x="-24" y="-118" width="48" height="6" rx="3" fill="#EA580C" fill-opacity="0.5" />
    
    <!-- Phone Screen Content -->
    <rect x="-72" y="-100" width="144" height="205" rx="12" fill="#3B1B10" />
    
    <!-- App Header Banner -->
    <rect x="-64" y="-92" width="128" height="32" rx="8" fill="url(#amberGrad)" />
    <text x="-56" y="-72" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#000000">iMme</text>
    <text x="56" y="-72" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#000000" text-anchor="end">WEDDING</text>

    <!-- Wedding Planner Tiles -->
    <rect x="-64" y="-52" width="60" height="58" rx="6" fill="#552615" stroke="#EA580C" stroke-width="0.8" stroke-opacity="0.4" />
    <rect x="4" y="-52" width="60" height="58" rx="6" fill="#552615" stroke="#EA580C" stroke-width="0.8" stroke-opacity="0.4" />
    <rect x="-64" y="14" width="60" height="58" rx="6" fill="#552615" stroke="#EA580C" stroke-width="0.8" stroke-opacity="0.4" />
    <rect x="4" y="14" width="60" height="58" rx="6" fill="#552615" stroke="#EA580C" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Memory Album Bar -->
    <rect x="-64" y="80" width="128" height="18" rx="5" fill="#10B981" />
    <text x="0" y="92" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">WEDDING MEMORIES</text>

    <!-- Floating Badge: Heart -->
    <g transform="translate(100, -40)">
      <circle cx="0" cy="0" r="28" fill="#EA580C" filter="url(#glowAmber)" />
      <path d="M 0 12 C -5 8 -15 2 -15 -5 C -15 -13 -5 -15 0 -8 C 5 -15 15 -13 15 -5 C 15 2 5 8 0 12 Z" fill="#422006" />
    </g>

    <!-- Floating Badge: RSVP -->
    <g transform="translate(-100, 30)">
      <circle cx="0" cy="0" r="26" fill="#2563EB" filter="url(#glowAmber)" />
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RSVP</text>
    </g>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(400, 400)" text-anchor="middle">
    <rect x="-130" y="-30" width="260" height="24" rx="12" fill="#EA580C" fill-opacity="0.2" stroke="#FDBA74" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="-14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FDBA74" letter-spacing="2">WEDDING PLANNER // IGENCO</text>
    
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">iMme Application</text>
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFEDD5" fill-opacity="0.85">วางแผนและบันทึกความทรงจำในวันแต่งงาน</text>
  </g>
</svg>