<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021E17" />
      <stop offset="50%" stop-color="#043226" />
      <stop offset="100%" stop-color="#01100C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00C864" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08382C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#021E17" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00C864" stroke-width="0.8" stroke-opacity="0.12" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <circle cx="700" cy="100" r="160" fill="#00FF88" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="100" cy="400" r="140" fill="#00C864" fill-opacity="0.07" filter="url(#glow)" />

  <!-- Code / IDE Window Representation -->
  <g transform="translate(180, 70)">
    <rect width="440" height="260" rx="16" fill="url(#windowGrad)" stroke="#00FF88" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 0 36 L 440 36" stroke="#00FF88" stroke-width="1" stroke-opacity="0.2" />
    
    <!-- Window dots -->
    <circle cx="20" cy="18" r="5" fill="#EF4444" fill-opacity="0.7" />
    <circle cx="36" cy="18" r="5" fill="#F59E0B" fill-opacity="0.7" />
    <circle cx="52" cy="18" r="5" fill="#10B981" fill-opacity="0.7" />
    <text x="220" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00FF88" fill-opacity="0.7" text-anchor="middle">software-ondemand.config.ts</text>

    <!-- Code Lines Mockup -->
    <text x="24" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6EE7B7">import { defineSolution } from '@igenco/core'</text>
    <text x="24" y="96" font-family="'JetBrains Mono', monospace" font-size="12" fill="#93C5FD">export const project = defineSolution({</text>
    <text x="44" y="122" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FCD34D">  mode: 'Software OnDemand',</text>
    <text x="44" y="148" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A7F3D0">  architecture: 'Cloud-Native Web &amp; Mobile',</text>
    <text x="44" y="174" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F472B6">  qualityStandard: 'ISO/IEC 29110 Certified',</text>
    <text x="44" y="200" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6EE7B7">  delivery: 'Tailor-Made Production Ready'</text>
    <text x="24" y="226" font-family="'JetBrains Mono', monospace" font-size="12" fill="#93C5FD">})</text>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(400, 390)" text-anchor="middle">
    <rect x="-140" y="-30" width="280" height="24" rx="12" fill="#00C864" fill-opacity="0.18" stroke="#00FF88" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="-14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#00FF88" letter-spacing="2">SERVICE DEVELOPMENT // IGENCO</text>
    
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Software OnDemand</text>
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#A7F3D0" fill-opacity="0.85">บริการพัฒนาซอฟต์แวร์ตามความต้องการเฉพาะองค์กร</text>
  </g>
</svg>