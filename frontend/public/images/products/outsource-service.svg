<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#070B19" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <pattern id="gridBlue" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.15" />
    </pattern>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradBlue)" />
  <rect width="800" height="500" fill="url(#gridBlue)" />

  <circle cx="700" cy="120" r="160" fill="#3B82F6" fill-opacity="0.1" filter="url(#glowBlue)" />
  <circle cx="100" cy="380" r="140" fill="#60A5FA" fill-opacity="0.08" filter="url(#glowBlue)" />

  <!-- Network / Team Node Graphics -->
  <g transform="translate(400, 190)">
    <!-- Connection lines -->
    <line x1="-150" y1="0" x2="0" y2="-60" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <line x1="150" y1="0" x2="0" y2="-60" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <line x1="-90" y1="80" x2="0" y2="-60" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <line x1="90" y1="80" x2="0" y2="-60" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <line x1="-150" y1="0" x2="-90" y2="80" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="150" y1="0" x2="90" y2="80" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Central Tech Lead Node -->
    <circle cx="0" cy="-60" r="38" fill="#1E3A8A" stroke="#60A5FA" stroke-width="3" />
    <circle cx="0" cy="-68" r="12" fill="#93C5FD" />
    <path d="M -16 -44 C -16 -54 16 -54 16 -44 Z" fill="#93C5FD" />
    <text x="0" y="-12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93C5FD" font-weight="bold" text-anchor="middle">LEAD DEV</text>

    <!-- Node 1: Frontend Engineer -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="30" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
      <circle cx="0" cy="-6" r="9" fill="#7DD3FC" />
      <path d="M -12 12 C -12 4 12 4 12 12 Z" fill="#7DD3FC" />
      <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7DD3FC" text-anchor="middle">FRONTEND</text>
    </g>

    <!-- Node 2: Backend Engineer -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="30" fill="#0F172A" stroke="#818CF8" stroke-width="2" />
      <circle cx="0" cy="-6" r="9" fill="#A5B4FC" />
      <path d="M -12 12 C -12 4 12 4 12 12 Z" fill="#A5B4FC" />
      <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A5B4FC" text-anchor="middle">BACKEND</text>
    </g>

    <!-- Node 3: QA / Tester -->
    <g transform="translate(-90, 80)">
      <circle cx="0" cy="0" r="26" fill="#0F172A" stroke="#34D399" stroke-width="2" />
      <circle cx="0" cy="-5" r="8" fill="#6EE7B7" />
      <path d="M -10 10 C -10 3 10 3 10 10 Z" fill="#6EE7B7" />
      <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6EE7B7" text-anchor="middle">QA / TESTER</text>
    </g>

    <!-- Node 4: System Analyst -->
    <g transform="translate(90, 80)">
      <circle cx="0" cy="0" r="26" fill="#0F172A" stroke="#F472B6" stroke-width="2" />
      <circle cx="0" cy="-5" r="8" fill="#FBCFE8" />
      <path d="M -10 10 C -10 3 10 3 10 10 Z" fill="#FBCFE8" />
      <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FBCFE8" text-anchor="middle">SYS ANALYST</text>
    </g>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(400, 400)" text-anchor="middle">
    <rect x="-140" y="-30" width="280" height="24" rx="12" fill="#2563EB" fill-opacity="0.2" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="-14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#60A5FA" letter-spacing="2">SERVICE DEVELOPMENT // IGENCO</text>
    
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">OutSource Service</text>
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#93C5FD" fill-opacity="0.85">บริการจัดหาทีมงานและโปรแกรมเมอร์ผู้เชี่ยวชาญด้าน IT</text>
  </g>
</svg>