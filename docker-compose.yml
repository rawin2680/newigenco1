services:
  # ==========================================
  # 1. DATABASE: PostgreSQL (TypeScript Friendly)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: verdant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strapi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strapi_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-strapi_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - verdant_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strapi_user} -d ${POSTGRES_DB:-strapi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. BACKEND: Strapi v5 (Headless CMS - TypeScript)
  #    (จะเปิดใช้งานในเฟส 2 หลังจากทำ Frontend เสร็จ)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: verdant_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-strapi_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-strapi_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-strapi_secure_pass}
      DATABASE_SSL: false
      APP_KEYS: ${APP_KEYS:-tobemodified1,tobemodified2,tobemodified3,tobemodified4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-tobemodifiedsalt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-tobemodifiedjwt}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-tobemodifiedtransfer}
      JWT_SECRET: ${JWT_SECRET:-tobemodifiedsecret}
    ports:
      - "1337:1337"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - verdant_net

  # ==========================================
  # 3. FRONTEND: Nuxt 3 (Vue 3 + TypeScript)
  #    (เริ่มพัฒนาตัวนี้เป็นอันดับแรกตามแผน)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: verdant_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      FRONTEND_PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NUXT_PUBLIC_STRAPI_URL: ${NUXT_PUBLIC_STRAPI_URL:-http://localhost:1337}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    networks:
      - verdant_net

volumes:
  postgres_data:
    name: verdant_postgres_data
  strapi_uploads:
    name: verdant_strapi_uploads

networks:
  verdant_net:
    name: verdant_network
    driver: bridge
